name: Catalog canary

# Every day, regenerates the catalogs from the latest nixpkgs, Home Manager and disko and runs the tests
# and the parser checks (the corpus, and the differential run over every file, in parallel parts) against them. If an
# upstream change breaks what nixchecker expects (an option moved, a type changed, the renames stopped
# being readable, a new syntax), it opens an issue. Nothing is committed: this only reports.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Latest upstream
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- catalog --update
      - run: devenv shell -- unit
      - name: The parser accepts the latest nixpkgs and Home Manager
        run: devenv shell -- corpus
      - name: The validator agrees with the real module systems of every release, on a new sample every day
        run: devenv shell -- oracle 60 $(date +%j) all

  # The latest upstream is chosen once, here, so that every part of the differential run below
  # reads the same nixpkgs and Home Manager.
  lock:
    name: Latest upstream lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-devenv
      - run: nix flake update --flake tools/catalog --extra-experimental-features "nix-command flakes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-lock
          path: tools/catalog/flake.lock
          if-no-files-found: error
          retention-days: 1

  # The parser against the official one on every damaged file took almost an hour in one job: each
  # part (a sixth of the files) runs on its own runner.
  differential:
    name: Parser vs Nix, damaged (${{ matrix.part }}/6)
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-devenv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog-lock
          path: tools/catalog
      - name: The parser agrees with the official one on every file of this part, damaged
        run: devenv shell -- differential 1 0x2545f491 ${{ matrix.part }}/6

  report:
    name: Report failures
    needs: [latest, differential]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary: tests fail against the latest upstream catalogs"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          body="The daily canary failed. Check which test broke: $RUN_URL"
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug; fi
