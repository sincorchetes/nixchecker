name: Catalog canary

# Every day, regenerates the catalogs from the latest nixpkgs, Home Manager and disko and runs the tests
# and the parser checks (the corpus, and the differential run over every file) against them. If an
# upstream change breaks what nixchecker expects (an option moved, a type changed, the renames stopped
# being readable, a new syntax), it opens an issue. Nothing is committed: this only reports.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Latest upstream
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- catalog --update
      - run: devenv shell -- unit
      - name: The parser accepts the latest nixpkgs and Home Manager
        run: devenv shell -- corpus
      - name: The parser agrees with the official one on every file, damaged
        run: devenv shell -- differential 1
      - name: The validator agrees with the real module systems of every release, on a new sample every day
        run: devenv shell -- oracle 60 $(date +%j) all

  report:
    name: Report failures
    needs: latest
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary: tests fail against the latest upstream catalogs"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          body="The daily canary failed. Check which test broke: $RUN_URL"
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug; fi
