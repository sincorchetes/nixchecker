name: CI

# Continuous integration. Every step runs through devenv (`devenv shell -- <script>`), so CI does exactly
# what a developer does locally; the scripts live in devenv.nix.
# It is also reused from deploy.yml and release.yml (workflow_call): nothing ships without passing here.
on:
  pull_request:
  push:
    branches-ignore: [main] # main goes through deploy.yml, which calls this workflow
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A called workflow gets no concurrency group of its own, so it never blocks its caller.
concurrency:
  group: ${{ github.event_name == 'workflow_call' && format('ci-call-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  CI: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - name: Format and lint (Biome)
        run: devenv shell -- lint
      - name: Types (tsc)
        run: devenv shell -- check
      - name: Tests with coverage gate (100% of lines)
        run: devenv shell -- unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # The committed catalogs must be what the pinned upstream sources generate (tools/catalog/flake.lock).
  catalog:
    name: Catalogs up to date
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- catalog
      - name: Fail if regenerating changed anything
        run: |
          if ! git diff --quiet -- public/catalog; then
            git diff --stat -- public/catalog
            echo "Changed rows (< committed, > regenerated):"
            for f in $(git diff --name-only -- public/catalog | grep -v manifest.json); do
              echo "== $f"
              diff <(git show "HEAD:$f" | jq -c '.[]') <(jq -c '.[]' "$f") | cut -c1-300 | head -40 || true
            done
            exit 1
          fi
      - name: The parser accepts every .nix file of nixpkgs and Home Manager
        run: devenv shell -- corpus
      - name: The parser agrees with the official one on damaged files
        run: devenv shell -- differential
      - name: The package builds and its command line works
        run: nix flake check --extra-experimental-features "nix-command flakes"
      - name: The package evaluates for every platform it declares (it is only built for this one)
        run: nix flake check --all-systems --no-build --extra-experimental-features "nix-command flakes"
      - name: The command line works against real Nix (own modules, imports, --partial, flakes)
        run: devenv shell -- integration

  # The validator against the real module systems. Each group of targets evaluates with Nix on its own
  # runner: in one job they ran for over 25 minutes.
  oracle:
    name: Validator vs Nix (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [nixos, home-manager, nix-darwin, disko, extensions, nix-conf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - name: The validator agrees with the real module system
        if: ${{ matrix.group != 'nix-conf' }}
        run: devenv shell -- oracle 40 1 only=${{ matrix.group }}
      - name: The nix.conf check agrees with Nix
        if: ${{ matrix.group == 'nix-conf' }}
        run: devenv shell -- bun tools/oracle/nix-conf.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- site-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Browser tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: devenv shell -- e2e
        env:
          # The runner image ships Firefox; the Firefox test must run there, not be skipped.
          REQUIRE_FIREFOX: "1"

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only runs if the repository defines the SONAR_HOST_URL variable (and the SONAR_TOKEN secret).
    # The server must be reachable from GitHub (localhost will not work).
    if: ${{ vars.SONAR_HOST_URL != '' }}
    # The coverage report comes from the quality job.
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - run: devenv shell -- sonar
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

  # A single result to require in the branch ruleset.
  ci-ok:
    name: CI passed
    if: ${{ always() }}
    needs: [quality, catalog, oracle, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # Every required job must have succeeded: a skipped or cancelled one is not a pass.
          if echo "$RESULTS" | grep '"result":' | grep -vq '"result": "success"'; then echo "A job did not succeed"; exit 1; fi
          echo "All jobs passed"
