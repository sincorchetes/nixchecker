name: Deploy to GitHub Pages

# Publishes on every push to main, manually, and every Monday (a cheap way to keep the
# published site fresh).
#
# Optional settings (Settings → Secrets and variables → Actions → Variables):
#   PAGES_SITE  site origin; defaults to https://nixchecker.sincorchetes.tech
#   PAGES_BASE  base path; defaults to / (use /<repository>/ when publishing without the custom domain)
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build for Pages
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- site-build
        env:
          SITE: ${{ vars.PAGES_SITE || 'https://nixchecker.sincorchetes.tech' }}
          BASE: ${{ vars.PAGES_BASE || '/' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
