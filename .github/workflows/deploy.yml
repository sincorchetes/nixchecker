name: Deploy to GitHub Pages

# Publishes on every push to main, manually, and every Monday (a cheap way to keep the
# published site fresh).
#
# Optional settings (Settings → Secrets and variables → Actions → Variables):
#   PAGES_SITE  site origin; defaults to https://nixchecker.sincorchetes.tech
#   PAGES_BASE  base path; defaults to / (use /<repository>/ when publishing without the custom domain)
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build for Pages
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- site-build
        env:
          SITE: ${{ vars.PAGES_SITE || 'https://nixchecker.sincorchetes.tech' }}
          BASE: ${{ vars.PAGES_BASE || '/' }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
