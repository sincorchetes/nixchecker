name: Secret scan

# Looks for secrets (tokens, keys) across the whole history with gitleaks, run inside devenv.
# Its configuration lives in .gitleaks.toml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted later is still in the history
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- secrets
