name: Release

# A `v*` tag (v0.0.<n>) publishes a GitHub Release with the packaged site, its SHA-256 sum, a signed provenance
# attestation of the zip (verify it with `gh attestation verify <zip> --repo sincorchetes/nixchecker`) and automatic notes.
# Run manually (Run workflow), it only packages, to test without publishing anything.
# Publishing to GitHub Pages is separate: deploy.yml does it on every merge to main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    name: Package
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to create the Release
      id-token: write # to sign the attestation
      attestations: write # to store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- site-build
        env:
          SITE: ${{ vars.PAGES_SITE || 'https://nixchecker.sincorchetes.tech' }}
          BASE: ${{ vars.PAGES_BASE || '/' }}
      - name: Zip
        run: |
          name="nixchecker-site-${GITHUB_REF_NAME//\//-}"
          (cd dist && zip -qr "../$name.zip" .)
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - name: Attest the provenance of the zip
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ env.ASSET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-site
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
      - name: Create the Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
