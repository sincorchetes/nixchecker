name: Set up devenv
description: Installs Nix and devenv and checks that bun.lock is up to date. Every other step runs with `devenv shell -- <script>`.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
    - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
      with:
        name: devenv
    - name: Install devenv
      shell: bash
      # Pinned by commit (v2.1.2): a tag can be moved, a commit cannot.
      run: nix profile install github:cachix/devenv/ea3d94ac9d6bf6a1313773170122ca4e2ef5a0be
    - name: Dependencies (frozen bun.lock)
      shell: bash
      run: devenv shell -- bun install --frozen-lockfile
