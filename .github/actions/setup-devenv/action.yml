name: Set up devenv
description: Installs Nix and devenv and checks that bun.lock is up to date. Every other step runs with `devenv shell -- <script>`.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v15
      with:
        name: devenv
    - name: Install devenv
      shell: bash
      run: nix profile install github:cachix/devenv/v2.1.2
    - name: Dependencies (frozen bun.lock)
      shell: bash
      run: devenv shell -- bun install --frozen-lockfile
